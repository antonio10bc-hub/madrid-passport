<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Madrid Passport">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Madrid Passport</title>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Madrid Passport</p>
        <h1 id="title">Explora Madrid</h1>
      </div>
      <div class="ring" id="ring" aria-label="Progreso"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fg" id="ring-fg" cx="18" cy="18" r="15.9"/></svg><span id="ring-txt">0%</span></div>
    </header>

    <div id="map"></div>
    <button class="locate" id="locate" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></button>
    <button class="locate share" id="share" aria-label="Compartir mi mapa"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>

    <section class="sheet" id="sheet">
      <div class="handle" id="handle"></div>
      <div id="sheet-body"></div>
    </section>

    <div class="debug" id="debug" hidden>
      <span class="dot"></span><div><b>GPS falso</b><small id="debug-pos">toca el mapa</small></div>
      <button id="debug-move">Mover</button><button id="debug-validate" title="Validar coordenadas con Wikipedia">Validar</button><button id="debug-reset" title="Borrar progreso">↺</button><button id="debug-off" aria-label="Salir">✕</button>
    </div>
    <div class="suggest" id="suggest">
      <button class="sg-main" id="suggest-open"><span class="sg-ico">📍</span><span><b id="suggest-name"></b><small id="suggest-sub"></small></span></button>
      <button class="sg-ok" id="suggest-ok">Confirmar</button><button class="sg-no" id="suggest-no" aria-label="Descartar">✕</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="js/data.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
