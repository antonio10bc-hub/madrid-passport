<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Madrid Passport">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Madrid Passport</title>
  <!-- Conexión anticipada al servidor del mapa y precarga de todos los módulos (evita la cascada de imports) -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="modulepreload" href="js/app/main.js">
  <link rel="modulepreload" href="js/app/util.js">
  <link rel="modulepreload" href="js/app/i18n.js">
  <link rel="modulepreload" href="js/app/state.js">
  <link rel="modulepreload" href="js/app/geo.js">
  <link rel="modulepreload" href="js/app/sheet.js">
  <link rel="modulepreload" href="js/app/map.js">
  <link rel="modulepreload" href="js/app/gps.js">
  <link rel="modulepreload" href="js/app/wiki.js">
  <link rel="modulepreload" href="js/app/views.js">
  <link rel="modulepreload" href="js/app/pages.js">
  <link rel="modulepreload" href="js/app/level.js">
  <link rel="modulepreload" href="js/app/sync.js">
  <link rel="modulepreload" href="js/app/analytics.js">
  <link rel="modulepreload" href="js/app/notify.js">
  <link rel="modulepreload" href="js/app/metro.js">
  <link rel="modulepreload" href="js/app/onboarding.js">
  <link rel="preload" href="data/distritos.geojson" as="fetch" crossorigin>
  <link rel="preload" href="data/barrios.geojson" as="fetch" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1 id="title" data-i18n="title.home">Explora Madrid</h1>
      </div>
      <div class="ring" id="ring" data-i18n-aria="aria.progress" aria-label="Progreso"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fg" id="ring-fg" cx="18" cy="18" r="15.9"/></svg><span id="ring-txt">0%</span></div>
    </header>

    <div id="map"></div>
    <button class="locate" id="locate" data-i18n-aria="aria.locate" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></button>
    <button class="locate share" id="share" data-i18n-aria="aria.share" aria-label="Compartir mi mapa"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>

    <div class="heat-legend" id="heat-legend" aria-hidden="true"><span data-i18n="heat.legend">% visitado</span><i></i><small>0</small><small>100</small></div>

    <section class="sheet" id="sheet">
      <div class="handle" id="handle"></div>
      <div id="sheet-body"></div>
    </section>

    <div class="debug" id="debug" hidden>
      <span class="dot"></span><div><b>GPS falso</b><small id="debug-pos">toca el mapa</small></div>
      <button id="debug-move">Mover</button><button id="debug-validate" title="Validar coordenadas con Wikipedia">Validar</button><button id="debug-reset" title="Borrar progreso">↺</button><button id="debug-off" aria-label="Salir del modo debug"><svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <section class="page" id="page" hidden>
      <header class="page-head"><h1 id="page-title"></h1></header>
      <div id="page-body"></div>
    </section>

    <nav class="tabbar">
      <button data-tab="diary"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h11M9 8h6"/></svg><span data-i18n="tab.diary">Diario</span></button>
      <button data-tab="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span data-i18n="tab.map">Mapa</span></button>
      <button data-tab="badges"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5"/></svg><span data-i18n="tab.badges">Logros</span></button>
    </nav>

    <div class="suggest" id="suggest">
      <button class="sg-main" id="suggest-open"><span class="sg-ico"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span><b id="suggest-name"></b><small id="suggest-sub"></small></span></button>
      <button class="sg-ok" id="suggest-ok" data-i18n="suggest.ok">Confirmar</button><button class="sg-no" id="suggest-no" data-i18n-aria="aria.dismiss" aria-label="Descartar"><svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script defer src="vendor/maplibre/maplibre-gl.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/badges.js"></script>
  <script defer src="js/share.js"></script>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
